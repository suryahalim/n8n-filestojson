name: doc-pipeline

services:
  # n8n removed 2026-10-02: intake is now extractor-native (/view/upload folder DFS,
  # /documents/folder[/scan], auto-OCR chain). Workflows archived in archive/n8n-2026-10-02/.
  db:
    image: postgres:16-alpine
    container_name: dp-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pipeline
      - POSTGRES_PASSWORD=${PIPELINE_DB_PASSWORD}
      - POSTGRES_DB=pipeline
    volumes:
      - dp-pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dp]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dp-rabbit
    restart: unless-stopped
    hostname: dp-rabbit
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    ports:
      - "100.68.212.36:15672:15672"
    volumes:
      - dp-rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [dp]

  extractor:
    build: ./extractor
    container_name: dp-extractor
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "100.68.212.36:5000:5000"
    environment:
      - DATABASE_URL=postgresql://pipeline:${PIPELINE_DB_PASSWORD}@db:5432/pipeline
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=${RABBITMQ_USER}
      - RABBIT_PASS=${RABBITMQ_PASS}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - OCR_ENGINE=${OCR_ENGINE:-qwen}
      - INGEST_ALLOW_DUP=${INGEST_ALLOW_DUP:-0}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-0}
      - OCR_AUTO=${OCR_AUTO:-1}
      - OCR_WORKERS=${OCR_WORKERS:-4}
      - OCR_NUMERIC_VERIFY=${OCR_NUMERIC_VERIFY:-0}  # selective 2nd-pass numeric verification OFF (speed/cost)
      - MAP_AUTO=${MAP_AUTO:-0}
      - SETTINGS_PIN=${SETTINGS_PIN:-}
      - UPLOAD_DIR=/data/uploads
      - TARGET_API_URL=http://extractor:5000/mock/receiving
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [dp]

  worker:
    build: ./worker
    container_name: dp-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://pipeline:${PIPELINE_DB_PASSWORD}@db:5432/pipeline
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=${RABBITMQ_USER}
      - RABBIT_PASS=${RABBITMQ_PASS}
      - MAX_ATTEMPTS=3
    depends_on:
      extractor:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [dp]

volumes:
  dp-pgdata:
  dp-rabbit:

networks:
  dp:
